services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ush
      POSTGRES_PASSWORD: ${USH_DB_PASSWORD:?Run ./scripts/dev-up.sh to generate local credentials}
      POSTGRES_DB: ush
    volumes:
      - ush-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ush -d ush"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ush
      PGDATABASE: ush
      PGPASSWORD: ${USH_DB_PASSWORD:?Run ./scripts/dev-up.sh to generate local credentials}
      USH_APP_DB_PASSWORD: ${USH_APP_DB_PASSWORD:?Run ./scripts/dev-up.sh to generate local credentials}
    volumes:
      - ./scripts/init-app-db-role.sh:/usr/local/bin/init-app-db-role.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-app-db-role.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hub:
    image: universal-service-hub:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      USH_ENVIRONMENT: development
      USH_SECRET_BACKEND: env
      USH_DATABASE_URL: postgres://ush_app:${USH_APP_DB_PASSWORD:?Run ./scripts/dev-up.sh to generate local credentials}@postgres:5432/ush
      USH_API_TOKEN: ${USH_API_TOKEN:?Run ./scripts/dev-up.sh to generate local credentials}
      USH_RATE_LIMIT_PER_MINUTE: ${USH_RATE_LIMIT_PER_MINUTE:-120}
      HOST: 0.0.0.0
      PORT: 8000
      RUST_LOG: info
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  ush-postgres-data:
