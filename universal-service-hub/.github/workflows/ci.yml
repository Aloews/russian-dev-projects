name: universal-service-hub-ci

on:
  push:
    paths:
      - "universal-service-hub/**"
  pull_request:
    paths:
      - "universal-service-hub/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-service-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: universal-service-hub/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Tests
        run: pytest -q
      - name: Docker build
        run: docker build -t universal-service-hub:test .
