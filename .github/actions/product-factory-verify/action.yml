name: Product Factory verification
description: Apply a candidate patch in an isolated runner and execute all release-candidate gates

inputs:
  target_repo:
    required: true
  base_branch:
    required: true
  github_token:
    required: true
  candidate_artifact:
    required: true
  verification_artifact:
    required: true

outputs:
  passed:
    description: Whether every configured verification gate passed
    value: ${{ steps.verify.outcome == 'success' }}
  repairable:
    description: Whether the patch applied and verification failed
    value: ${{ steps.apply_patch.outcome == 'success' && steps.verify.outcome == 'failure' }}

runs:
  using: composite
  steps:
    - name: Validate target repository inputs
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.target_repo }}
        BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        set -Eeuo pipefail
        [[ "$TARGET_REPO" =~ ^Aloews/[A-Za-z0-9._-]+$ ]] || { echo "Invalid or missing target_repo input." >&2; exit 2; }
        [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid or missing base_branch input." >&2; exit 2; }
        git check-ref-format --branch "$BASE_BRANCH"

    - name: Check out target repository
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: ${{ inputs.target_repo }}
        ref: ${{ inputs.base_branch }}
        token: ${{ inputs.github_token }}
        path: target
        fetch-depth: 1
        persist-credentials: false

    - name: Verify target checkout identity and base ref
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.target_repo }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        PRODUCT_FACTORY_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -Eeuo pipefail
        EXPECTED_ORIGIN="https://github.com/$TARGET_REPO"
        ACTUAL_ORIGIN="$(git -C target remote get-url origin)"
        [[ "$ACTUAL_ORIGIN" == "$EXPECTED_ORIGIN" || "$ACTUAL_ORIGIN" == "$EXPECTED_ORIGIN.git" ]] || {
          echo "Verifier checked out an unexpected repository: $ACTUAL_ORIGIN" >&2
          exit 2
        }
        AUTH="$(printf 'x-access-token:%s' "$PRODUCT_FACTORY_GITHUB_TOKEN" | base64 -w0)"
        REMOTE_BASE_SHA="$(git -C target -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote origin "refs/heads/$BASE_BRANCH" | cut -f1)"
        CHECKED_OUT_SHA="$(git -C target rev-parse HEAD)"
        [[ -n "$REMOTE_BASE_SHA" && "$CHECKED_OUT_SHA" == "$REMOTE_BASE_SHA" ]] || {
          echo "Verifier checkout does not match the current target base branch tip." >&2
          exit 2
        }

    - name: Download candidate patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ inputs.candidate_artifact }}
        path: ${{ runner.temp }}/candidate

    - name: Fetch and apply patch at recorded base SHA
      id: apply_patch
      shell: bash
      env:
        PRODUCT_FACTORY_GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -Eeuo pipefail
        BASE_SHA="$(cat "$RUNNER_TEMP/candidate/base.sha")"
        bash factory/.github/scripts/checkout_candidate_base.sh target "$BASE_SHA"
        git -C target apply "$RUNNER_TEMP/candidate/candidate.patch"
        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Restore Rust build cache
      uses: Swatinem/rust-cache@f4371d1ec7179bfbd04a82a81e3b3af7f720750f
      with:
        workspaces: target -> target

    - name: Install Node.js
      uses: actions/setup-node@436c65619b12c9e37ff20a4700145cc387898a7d
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: target/package-lock.json

    - name: Run verification gates
      id: verify
      continue-on-error: true
      shell: bash
      run: |
        set +e
        bash factory/universal-service-hub/scripts/product_factory_verify.sh target "$RUNNER_TEMP/verification.log"
        rc=$?
        exit "$rc"

    - name: Upload verification report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.verification_artifact }}
        path: ${{ runner.temp }}/verification.log
        if-no-files-found: ignore
        retention-days: 30
