name: Product Factory verification
description: Apply a candidate patch, run configured gates and validate SHA-bound evidence

inputs:
  target_repo:
    required: true
  base_branch:
    required: true
  github_token:
    required: true
  candidate_artifact:
    required: true
  verification_artifact:
    required: true

outputs:
  passed:
    description: Whether configured gates and the machine evidence gate passed
    value: ${{ steps.evidence_gate.outcome == 'success' }}
  repairable:
    description: Whether the patch applied but verification or evidence validation failed
    value: ${{ steps.apply_patch.outcome == 'success' && steps.evidence_gate.outcome == 'failure' }}

runs:
  using: composite
  steps:
    - name: Check out target repository
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: ${{ inputs.target_repo }}
        ref: ${{ inputs.base_branch }}
        token: ${{ inputs.github_token }}
        path: target
        fetch-depth: 0
        persist-credentials: false

    - name: Download candidate patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ inputs.candidate_artifact }}
        path: ${{ runner.temp }}/candidate

    - name: Apply patch and create immutable candidate commit
      id: apply_patch
      shell: bash
      run: |
        set -Eeuo pipefail
        BASE_SHA="$(cat "$RUNNER_TEMP/candidate/base.sha")"
        [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid recorded base SHA" >&2; exit 2; }
        git -C target checkout --detach "$BASE_SHA"
        git -C target apply --check "$RUNNER_TEMP/candidate/candidate.patch"
        git -C target apply "$RUNNER_TEMP/candidate/candidate.patch"
        git -C target add -A
        git -C target diff --cached --check
        git -C target diff --cached --quiet && { echo "Empty candidate patch" >&2; exit 2; }
        git -C target -c user.name="Product Factory Verification" -c user.email="product-factory@users.noreply.github.com" commit -m "test: materialize isolated Product Factory candidate" >/dev/null
        CANDIDATE_SHA="$(git -C target rev-parse HEAD)"
        git -C target diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" > "$RUNNER_TEMP/changed-paths.txt"
        test -s "$RUNNER_TEMP/changed-paths.txt"
        echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Restore Rust build cache
      uses: Swatinem/rust-cache@f4371d1ec7179bfbd04a82a81e3b3af7f720750f
      with:
        workspaces: target -> target

    - name: Install Node.js
      uses: actions/setup-node@436c65619b12c9e37ff20a4700145cc387898a7d
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: target/package-lock.json

    - name: Run verification gates
      id: verify
      continue-on-error: true
      shell: bash
      run: |
        set +e
        bash factory/universal-service-hub/scripts/product_factory_verify.sh target "$RUNNER_TEMP/verification.log"
        rc=$?
        exit "$rc"

    - name: Validate SHA-bound CODE_VERIFIED evidence
      id: evidence_gate
      if: always() && steps.apply_patch.outcome == 'success'
      shell: bash
      env:
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        CANDIDATE_SHA: ${{ steps.apply_patch.outputs.candidate_sha }}
      run: |
        set -Eeuo pipefail
        python3 - <<'PY'
        import hashlib, json, os, re, subprocess, sys
        from pathlib import Path

        root = Path("target")
        report = Path(os.environ["RUNNER_TEMP"]) / "verification.log"
        if not report.is_file():
            raise SystemExit("Verification log missing; fail closed")
        log = report.read_text(encoding="utf-8", errors="replace")
        if os.environ["VERIFY_OUTCOME"] != "success":
            raise SystemExit("Configured verification gates did not all pass")
        patterns = [
            r"test result: ok\.\s+(\d+) passed",
            r"(\d+) passed(?:,|\s+in\s+)",
            r"ℹ tests\s+(\d+)",
            r"# tests\s+(\d+)",
        ]
        counts = [int(n) for pattern in patterns for n in re.findall(pattern, log, re.I)]
        go_packages = re.findall(r"^ok\s+\S+\s+[0-9.]+s?$", log, re.M)
        discovered = max(counts, default=1 if go_packages else 0)
        if discovered <= 0:
            raise SystemExit("No positive test count found in test output; zero/unknown tests are not accepted")
        candidate = os.environ["CANDIDATE_SHA"]
        if not re.fullmatch(r"[0-9a-f]{40}", candidate):
            raise SystemExit("Candidate SHA is invalid")
        current = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
        if current != candidate:
            raise SystemExit("Candidate SHA changed after verification")
        dirty = subprocess.check_output(["git", "-C", str(root), "status", "--porcelain"], text=True).strip()
        if dirty:
            raise SystemExit("Verification modified the candidate working tree; refusing ambiguous tested SHA")
        base = subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD^"], text=True).strip()
        paths = subprocess.check_output(["git", "-C", str(root), "diff", "--name-only", base, candidate], text=True).splitlines()
        if not paths:
            raise SystemExit("Candidate has no source diff")
        digest = hashlib.sha256(report.read_bytes()).hexdigest()
        manifest = {
            "verification_level": "CODE_VERIFIED",
            "candidate_sha": candidate,
            "tested_sha": current,
            "changed_paths": paths,
            "required_check_ids": ["tests"],
            "checks": [{
                "id": "tests",
                "executed": True,
                "exit_code": 0,
                "tests_discovered": discovered,
                "candidate_sha": candidate,
                "command": "product_factory_verify.sh (test gates in verification.log)",
                "artifact": "verification.log",
                "artifact_sha256": digest,
            }],
        }
        temp = Path(os.environ["RUNNER_TEMP"])
        (temp / "completion-evidence.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
        PY
        python3 factory/universal-service-hub/scripts/validate_completion_evidence.py \
          --manifest "$RUNNER_TEMP/completion-evidence.json" \
          --expected-sha "$CANDIDATE_SHA" \
          --diff-file "$RUNNER_TEMP/changed-paths.txt" \
          --level CODE_VERIFIED \
          --workspace "$RUNNER_TEMP"

    - name: Upload verification report and evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.verification_artifact }}
        path: |
          ${{ runner.temp }}/verification.log
          ${{ runner.temp }}/completion-evidence.json
          ${{ runner.temp }}/changed-paths.txt
        if-no-files-found: ignore
        retention-days: 30
