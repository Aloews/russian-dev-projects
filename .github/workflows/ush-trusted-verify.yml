name: Universal Service Hub trusted verification

on:
  workflow_call:
    inputs:
      hub_base_url:
        description: HTTPS base URL of the Universal Service Hub API
        required: true
        type: string
      oidc_audience:
        description: Exact audience configured in USH_GITHUB_OIDC_AUDIENCE
        required: true
        type: string
      project_id:
        description: Hub project identifier
        required: true
        type: string
      task_id:
        description: Hub task identifier
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character commit SHA being verified
        required: true
        type: string

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Submit signed GitHub Actions evidence to the Hub
        shell: bash
        env:
          HUB_BASE_URL: ${{ inputs.hub_base_url }}
          OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
          PROJECT_ID: ${{ inputs.project_id }}
          TASK_ID: ${{ inputs.task_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$HUB_BASE_URL" =~ ^https://[^/]+(/[^?#]*)?$ ]]
          [[ "$OIDC_AUDIENCE" =~ ^[A-Za-z0-9._:/-]{1,200}$ ]]
          [[ "$PROJECT_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
          [[ "$TASK_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "${GITHUB_SHA,,}" == "${CANDIDATE_SHA,,}" ]]
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          oidc_response=$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            -H "Authorization: Bearer $OIDC_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          oidc_token=$(jq --exit-status --raw-output '.value | select(type == "string" and length > 100)' <<< "$oidc_response")
          unset oidc_response ACTIONS_ID_TOKEN_REQUEST_TOKEN

          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Accept: application/json" \
            "$HUB_BASE_URL/v1/projects/$PROJECT_ID/tasks/$TASK_ID/verification/github-actions" \
            | jq --exit-status --arg sha "${CANDIDATE_SHA,,}" \
                'select(.conclusion == "success" and .candidate_sha == $sha and (.evidence_id | type == "string" and length > 0))'
