name: Universal Service Hub trusted verification

on:
  workflow_call:
    inputs:
      hub_base_url:
        description: HTTPS base URL of the Universal Service Hub API
        required: true
        type: string
      oidc_audience:
        description: Exact audience configured in USH_GITHUB_OIDC_AUDIENCE
        required: true
        type: string
      project_id:
        description: Hub project identifier
        required: true
        type: string
      source_issue_number:
        description: Optional GitHub issue or pull request number used to disambiguate tasks
        required: false
        type: string
      source_run_id:
        description: Completed source build/test workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Completed source build/test workflow run attempt
        required: true
        type: string
      candidate_sha:
        description: Exact source workflow commit SHA
        required: true
        type: string

jobs:
  verify_candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ush
          POSTGRES_PASSWORD: ush-test-password
          POSTGRES_DB: ush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ush -d ush_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact candidate SHA without persisted credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: rustfmt, clippy

      - name: Verify Rust candidate independently
        working-directory: candidate/universal-service-hub
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client and Python dependencies
        working-directory: candidate/universal-service-hub
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -e ".[dev]"

      - name: Verify Python migrations and tests independently
        working-directory: candidate/universal-service-hub
        env:
          PGPASSWORD: ush-test-password
          USH_DATABASE_URL: postgresql+asyncpg://ush_app:ush-test-password@localhost:5432/ush_test
        run: |
          set -euo pipefail
          psql -h localhost -U ush -d ush_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ush_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS; CREATE ROLE ush_app LOGIN PASSWORD 'ush-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; GRANT ush_runtime TO ush_app; GRANT CONNECT ON DATABASE ush_test TO ush_app; GRANT USAGE, CREATE ON SCHEMA public TO ush_app;"
          ruff check app tests migrations
          alembic upgrade head
          pytest -q

      - name: Build candidate container independently
        working-directory: candidate/universal-service-hub
        run: docker build --network=host --progress=plain -t ush-trusted-candidate:${{ inputs.candidate_sha }} .

      - name: Create trusted verification manifest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
          mkdir -p "$RUNNER_TEMP/ush-ci-evidence"
          jq -n --arg sha "${CANDIDATE_SHA,,}" --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" \
            '{source_sha:$sha,source_run_id:$run,source_run_attempt:$attempt,verification:"trusted-reusable-workflow"}' \
            > "$RUNNER_TEMP/ush-ci-evidence/ush-ci-evidence.json"

      - name: Upload trusted verification manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ush-ci-evidence
          path: ${{ runner.temp }}/ush-ci-evidence/ush-ci-evidence.json
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: verify_candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download trusted verification manifest from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ush-ci-evidence
          path: ${{ runner.temp }}/ush-ci-evidence

      - name: Calculate exact evidence artifact digest
        id: artifact
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
          manifest="$RUNNER_TEMP/ush-ci-evidence/ush-ci-evidence.json"
          if [[ ! -s "$manifest" ]]; then
            echo "Trusted CI evidence artifact is missing or empty" >&2
            exit 1
          fi
          jq --exit-status --arg sha "${CANDIDATE_SHA,,}" \
            --arg run_id "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" \
            'select((.source_sha | ascii_downcase) == $sha and .source_run_id == $run_id and .source_run_attempt == $attempt)' \
            "$manifest" >/dev/null
          digest=$(sha256sum "$manifest" | awk '{print "sha256:" $1}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "artifact_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Submit signed GitHub OIDC evidence to the Hub
        shell: bash
        env:
          HUB_BASE_URL: ${{ inputs.hub_base_url }}
          OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
          PROJECT_ID: ${{ inputs.project_id }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$HUB_BASE_URL" =~ ^https://[^/]+(/[^?#]*)?$ ]]
          [[ "$OIDC_AUDIENCE" =~ ^[A-Za-z0-9._:/-]{1,200}$ ]]
          [[ "$PROJECT_ID" =~ ^[A-Za-z0-9_-]{1,80}$ ]]
          if [[ -n "$SOURCE_ISSUE_NUMBER" ]]; then [[ "$SOURCE_ISSUE_NUMBER" =~ ^[0-9]{1,12}$ ]]; fi
          [[ "$CANDIDATE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[a-fA-F0-9]{64}$ ]]
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          oidc_response=$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          oidc_token=$(jq --exit-status --raw-output '.value | select(type == "string" and length > 100)' <<< "$oidc_response")
          unset oidc_response ACTIONS_ID_TOKEN_REQUEST_TOKEN

          payload=$(jq -nc --arg digest "${ARTIFACT_DIGEST,,}" \
            --arg sha "${CANDIDATE_SHA,,}" --arg run "$SOURCE_RUN_ID" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" --arg issue "$SOURCE_ISSUE_NUMBER" \
            '{candidate_sha:$sha,source_run_id:($run|tonumber),source_run_attempt:($attempt|tonumber),artifact_digest:$digest} + (if $issue == "" then {} else {source_issue_number:($issue|tonumber)} end)')
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$HUB_BASE_URL/v1/projects/$PROJECT_ID/verification/github-actions" \
            | jq --exit-status --arg sha "${CANDIDATE_SHA,,}" \
                'select(.candidate_sha == $sha and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "neutral" or .conclusion == "skipped" or .conclusion == "stale" or .conclusion == "startup_failure") and (.evidence_id | type == "string" and length > 0))'
