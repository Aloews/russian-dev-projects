name: universal-service-hub-ci

on:
  push:
    paths:
      - "universal-service-hub/**"
  pull_request:
    paths:
      - "universal-service-hub/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ush
          POSTGRES_PASSWORD: ush-test-password
          POSTGRES_DB: ush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ush -d ush_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: universal-service-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: universal-service-hub/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests migrations
      - name: Migration smoke test
        env:
          USH_DATABASE_URL: postgresql+asyncpg://ush:ush-test-password@localhost:5432/ush_test
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Docker build
        run: docker build -t universal-service-hub:test .
